<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="700" height="460" fill="white" stroke="#333" stroke-width="2"/>
  <text x="16" y="26" font-size="15" font-weight="bold">Navigation graph</text>

  <!-- Nodes -->
  <rect x="270" y="50" width="180" height="50" fill="#ddd" stroke="#333"/>
  <text x="290" y="80" font-size="12">1. Ready-check</text>

  <rect x="40" y="160" width="180" height="50" fill="#ddd" stroke="#333"/>
  <text x="60" y="190" font-size="12">2. Intake</text>

  <rect x="270" y="160" width="180" height="50" fill="#ddd" stroke="#333"/>
  <text x="285" y="190" font-size="12">3. Diagnosis &amp; quote</text>

  <rect x="500" y="160" width="180" height="50" fill="#ddd" stroke="#333"/>
  <text x="515" y="190" font-size="12">4. Overdue dashboard</text>

  <rect x="270" y="280" width="180" height="50" fill="#eee" stroke="#333" stroke-dasharray="4"/>
  <text x="300" y="310" font-size="12">5. Price list</text>
  <text x="290" y="345" font-size="10" fill="#777">(public — separate site)</text>

  <!-- Edges -->
  <line x1="270" y1="185" x2="220" y2="185" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="220" y1="200" x2="270" y2="200" stroke="#333" marker-end="url(#arrow)"/>

  <line x1="360" y1="100" x2="360" y2="160" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="345" y1="160" x2="345" y2="100" stroke="#333" marker-end="url(#arrow)"/>

  <line x1="450" y1="185" x2="500" y2="185" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="500" y1="200" x2="450" y2="200" stroke="#333" marker-end="url(#arrow)"/>

  <line x1="130" y1="210" x2="270" y2="80" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="590" y1="210" x2="370" y2="80" stroke="#333" marker-end="url(#arrow)"/>

  <line x1="590" y1="210" x2="400" y2="280" stroke="#333" marker-end="url(#arrow)"/>

  <text x="20" y="400" font-size="10" fill="#555">Every screen is reachable from Ready-check; every</text>
  <text x="20" y="414" font-size="10" fill="#555">screen links back, so nothing is a dead end.</text>
</svg>
